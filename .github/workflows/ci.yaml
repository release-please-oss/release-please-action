name: 'CI'

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Setup Node environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: 'package.json'
      - name: Cache NodeJS dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: nodejs-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('./package-lock.json') }}
      - name: Install NodeJS dependencies
        if: ${{ steps.nodejs-cache.outputs.cache-hit != 'true' }}
        run: npm ci --no-audit
      - name: Run tests
        run: npm run test
      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          use_oidc: true
          directory: 'coverage'
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          use_oidc: true
          directory: 'build/junit'
          fail_ci_if_error: true

  lint:
    name: 'Lint'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Setup Node environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: 'package.json'
      - name: Cache NodeJS dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: nodejs-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('./package-lock.json') }}
      - name: Install NodeJS dependencies
        if: ${{ steps.nodejs-cache.outputs.cache-hit != 'true' }}
        run: npm ci --no-audit
      - name: Lint
        # TODO: remove after applying fixes
        continue-on-error: true
        run: npm run lint

  format:
    name: 'Format'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Setup Node environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: 'package.json'
      - name: Cache NodeJS dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: nodejs-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('./package-lock.json') }}
      - name: Install NodeJS dependencies
        if: ${{ steps.nodejs-cache.outputs.cache-hit != 'true' }}
        run: npm ci --no-audit
      - name: Format
        run: npm run fmt:check

  build:
    name: 'Build'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: 'package.json'
      - name: Cache NodeJS dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: nodejs-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('./package-lock.json') }}
      - name: Install NodeJS dependencies
        if: ${{ steps.nodejs-cache.outputs.cache-hit != 'true' }}
        run: npm ci --no-audit
      - name: Run build
        run: npm run build
