name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 'Release'
    runs-on: ubuntu-26.04
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_OSS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Release Please
        uses: $/
        id: release
        with:
          token: ${{ steps.token.outputs.token }}
          release-type: node
          # language=json
          config-overrides-json: |
            {
              "extra-files": ["README.md"],
              "changelog-sections": [
                {
                  "type": "feat",
                  "hidden": false,
                  "section": "Features"
                },
                {
                  "type": "feature",
                  "hidden": false,
                  "section": "Features"
                },
                {
                  "type": "fix",
                  "hidden": false,
                  "section": "Bug Fixes"
                },
                {
                  "type": "chore",
                  "hidden": false,
                  "section": "Miscellaneous Chores"
                },
                {
                  "type": "docs",
                  "hidden": false,
                  "section": "Documentation"
                },
                {
                  "type": "refactor",
                  "hidden": false,
                  "section": "Code Refactoring"
                },
                {
                  "type": "deps",
                  "hidden": false,
                  "section": "Dependency updates"
                }
              ]
            }
