name: Build dist

on:
  push:
    branches:
      - main

jobs:
  build-dist:
    name: 'Build dist'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: 'package.json'
      - name: Cache NodeJS dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: nodejs-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('./package-lock.json') }}
      - name: Install NodeJS dependencies
        if: ${{ steps.nodejs-cache.outputs.cache-hit != 'true' }}
        run: npm ci --no-audit
      - name: Run build
        run: npm run build
      - name: Generate GitHub token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_OSS_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_OSS_BOT_PRIVATE_KEY }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          title: 'chore: automated dist build'
          commit-message: 'chore: automated dist build'
          sign-commits: true
          signoff: true
          base: main
          branch: chore-build-dist
          body: |
            Automated dist update by https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            automated
