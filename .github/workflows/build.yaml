name: Build dist

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-dist:
    name: 'Build dist'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
          package-manager-cache: true
      - name: Install NodeJS dependencies
        run: pnpm install --no-runtime --prefer-offline --frozen-lockfile
      - name: Run build
        run: pnpm run build
      - name: Generate GitHub token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_OSS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Pull Request
        # zizmor: ignore[superfluous-actions]
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.token.outputs.token }}
          title: 'chore: automated dist build'
          commit-message: 'chore: automated dist build'
          sign-commits: true
          signoff: true
          base: main
          branch: chore-build-dist
          body: |
            Automated dist update by https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            automated
