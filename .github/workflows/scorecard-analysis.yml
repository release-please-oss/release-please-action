name: 'Scorecard analysis workflow'

on:
  branch_protection_rule:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    permissions:
      security-events: write # Required when publishing results (badge / API / code scanning)
      id-token: write # Required when publishing results (badge / API / code scanning)
      contents: read # Recommended reads to avoid GraphQL/SAST gaps
      issues: read # Recommended reads to avoid GraphQL/SAST gaps
      pull-requests: read # Recommended reads to avoid GraphQL/SAST gaps
      checks: read # Recommended reads to avoid GraphQL/SAST gaps
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
