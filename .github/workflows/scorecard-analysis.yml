name: 'Scorecard analysis workflow'

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Required when publishing results (badge / API / code scanning)
      id-token: write # Required when publishing results (badge / API / code scanning)
      contents: read # Recommended reads to avoid GraphQL/SAST gaps
      issues: read # Recommended reads to avoid GraphQL/SAST gaps
      pull-requests: read # Recommended reads to avoid GraphQL/SAST gaps
      checks: read # Recommended reads to avoid GraphQL/SAST gaps
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: results.sarif
