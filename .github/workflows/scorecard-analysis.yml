name: 'Scorecard analysis workflow'

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Required when publishing results (badge / API / code scanning)
      id-token: write # Required when publishing results (badge / API / code scanning)
      contents: read # Recommended reads to avoid GraphQL/SAST gaps
      issues: read # Recommended reads to avoid GraphQL/SAST gaps
      pull-requests: read # Recommended reads to avoid GraphQL/SAST gaps
      checks: read # Recommended reads to avoid GraphQL/SAST gaps
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
