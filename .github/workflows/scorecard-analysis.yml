name: 'Scorecard analysis workflow'

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    permissions:
      security-events: write # Required when publishing results (badge / API / code scanning)
      id-token: write # Required when publishing results (badge / API / code scanning)
      contents: read # Recommended reads to avoid GraphQL/SAST gaps
      issues: read # Recommended reads to avoid GraphQL/SAST gaps
      pull-requests: read # Recommended reads to avoid GraphQL/SAST gaps
      checks: read # Recommended reads to avoid GraphQL/SAST gaps
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
